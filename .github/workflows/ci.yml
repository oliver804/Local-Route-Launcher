name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-icon:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Render shared artwork on a GPU-capable runner
        run: bash scripts/build-icon.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: brand-icon
          path: build/brand-icon/AppIcon.icns
          if-no-files-found: error
  build:
    needs: brand-icon
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SKIP_SYSTEM_ICON_CHECK: '1'
      MACOS_ARCH: ${{ matrix.arch }}
      PREBUILT_ICON_PATH: build/brand-icon/AppIcon.icns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: brand-icon
          path: build/brand-icon
      - name: Check source and test core behavior
        run: |
          test "$(uname -m)" = "$MACOS_ARCH"
          make check
          make test
      - name: Build release files
        run: make dmg
      - name: Verify release files
        run: make verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files-${{ matrix.arch }}
          path: |
            dist/*/*.dmg
            dist/*/*-source.zip
            dist/*/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.402'
      - name: Build, install, test and uninstall Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-installer-${{ matrix.runner }}
          path: dist/*/*-windows-x64-setup.exe
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-validation-${{ matrix.runner }}
          path: build/windows/test-results/*
          if-no-files-found: warn
          retention-days: 7
